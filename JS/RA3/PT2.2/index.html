<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Browser</title>
    <link rel="stylesheet" href="multibrowser.css">
</head>
<body>
    <div class="container">
        <h1 id="mainTitle"></h1>

        <!-- Avís per si el navegador bloqueja les finestres -->
        <div id="warningArea" class="warning" hidden></div>

        <!-- Camps d'entrada de les adreces web -->
        <div class="input-group">
            <label for="url1">Adreça 1</label>
            <input type="text" id="url1" placeholder="www.exemple.cat">
        </div>
        <div class="input-group">
            <label for="url2">Adreça 2</label>
            <input type="text" id="url2" placeholder="www.exemple.cat">
        </div>
        <div class="input-group">
            <label for="url3">Adreça 3</label>
            <input type="text" id="url3" placeholder="www.exemple.cat">
        </div>
        <div class="input-group">
            <label for="url4">Adreça 4</label>
            <input type="text" id="url4" placeholder="www.exemple.cat">
        </div>

        <!-- Botons -->
        <div class="button-group">
            <button id="btnVisit">Visitar</button>
            <button id="btnHistory">Historial de visites</button>
        </div>

        <!-- Data actual i última visita -->
        <footer>
            <p>Data i hora: <span id="currentClock"></span></p>
            <p><span id="lastVisit"></span></p>
        </footer>
    </div>

    <script src="multibrowser.js"></script>
</body>
</html>
